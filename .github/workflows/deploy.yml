name: Deploy Theme to Live Host

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Deploy Poetzen Theme
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 🛠️ Install dependencies & Build CSS
      run: |
        npm install
        npm run build:css

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ secrets.FTP_PORT }}
        server-dir: wp-content/themes/poetzen/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .github/**
          tests/**
          README.md
